[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-explainability-benchmark"
version = "0.1.0"
description = "A comprehensive, axiomatically-grounded explainability benchmark for Vision Transformers (TPAMI)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    # Kept anonymous for double-blind review; restore real authors after acceptance.
    { name = "Anonymous Authors", email = "anon@example.com" }
]
keywords = ["vision", "transformer", "explainability", "benchmark", "xai", "tpami"]
# Keep in sync with requirements.txt
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=0.9.16",
    "transformers>=4.40.0",
    "huggingface_hub>=0.22.0",
    "datasets>=2.19.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2",
    "python-louvain>=0.16",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "Pillow>=10.3.0",
]

[project.scripts]
vit-bench = "run_phase3:main"

[tool.setuptools]
packages = ["explainers", "metrics", "model_zoo", "training", "utils"]
py-modules = ["run_phase3", "main"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
